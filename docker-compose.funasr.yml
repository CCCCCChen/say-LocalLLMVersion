# FunASR Docker Compose Configuration
# 用于快速部署FunASR转录服务
#
# 使用方法:
# 1. 启动离线转录服务: docker-compose -f docker-compose.funasr.yml up -d
# 2. 启动实时转录服务: docker-compose -f docker-compose.funasr.yml --profile realtime up -d
# 3. 停止服务: docker-compose -f docker-compose.funasr.yml down
# 4. 查看日志: docker-compose -f docker-compose.funasr.yml logs -f
# 5. 重启服务: docker-compose -f docker-compose.funasr.yml restart

version: '3.8'

services:
  # FunASR 离线文件转录服务 (默认)
  funasr-offline:
    # image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.10
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-cpu-0.4.1
    container_name: funasr-offline-server
    ports:
      - "10095:10095"  # 离线转录服务端口
    restart: unless-stopped
    environment:
      # 基础配置
      - FUNASR_PORT=10095
      - FUNASR_HOST=0.0.0.0
      - MODEL_DIR=/workspace/models
      - DEVICE=cpu
      - WORKERS=4
      # 模型配置
      - ASR_MODEL=speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch
      - VAD_MODEL=speech_fsmn_vad_zh-cn-16k-common-pytorch
      - PUNC_MODEL=punc_ct-transformer_zh-cn-common-vocab272727-pytorch
      - LM_MODEL=speech_transformer_lm_zh-cn-common-vocab8404-pytorch
      - ITN_MODEL=fst_itn_zh
    volumes:
      - funasr_models:/workspace/models
      - ./audio_files:/workspace/audio_files  # 可选：挂载音频文件目录
      - ./hotwords.txt:/workspace/models/hotwords.txt  # 可选：热词文件
    command: >
      bash -c "
        echo '启动FunASR离线转录服务...' &&
        python funasr_wss_server.py \
          --host 0.0.0.0 \
          --port 10095 \
          --model-dir /workspace/models \
          --vad-dir /workspace/models/speech_fsmn_vad_zh-cn-16k-common-pytorch \
          --punc-dir /workspace/models/punc_ct-transformer_zh-cn-common-vocab272727-pytorch \
          --lm-dir /workspace/models/speech_transformer_lm_zh-cn-common-vocab8404-pytorch \
          --itn-dir /workspace/models/fst_itn_zh \
          --hotword /workspace/models/hotwords.txt \
          --certfile '' \
          --keyfile ''
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10095/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 给模型下载更多时间
    networks:
      - funasr-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FunASR 实时转录服务 (可选)
  funasr-realtime:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.10
    container_name: funasr-realtime-server
    ports:
      - "10096:10096"  # 实时转录服务端口
    restart: unless-stopped
    environment:
      - FUNASR_PORT=10096
      - FUNASR_HOST=0.0.0.0
      - MODEL_DIR=/workspace/models
      - DEVICE=cpu
      - WORKERS=2
    volumes:
      - funasr_models:/workspace/models
    command: >
      bash -c "
        echo '启动FunASR实时转录服务...' &&
        python funasr_wss_server.py \
          --host 0.0.0.0 \
          --port 10096 \
          --model-dir /workspace/models \
          --vad-dir /workspace/models/speech_fsmn_vad_zh-cn-16k-common-pytorch \
          --punc-dir /workspace/models/punc_ct-transformer_zh-cn-common-vocab272727-pytorch \
          --mode online \
          --certfile '' \
          --keyfile ''
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - funasr-network
    profiles:
      - realtime  # 使用 --profile realtime 启动
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  funasr_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./funasr_models  # 模型存储目录，会自动创建

networks:
  funasr-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16